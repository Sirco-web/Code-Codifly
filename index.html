<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Compiler</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>Code Compiler</h1>
            <button id="runBtn" class="run-btn">▶ Run</button>
        </div>

        <!-- Main Content Area -->
        <div class="main-content">
            <!-- Left Editor Panel -->
            <div class="editor-panel">
                <!-- Tabs -->
                <div class="tabs">
                    <button class="tab-btn active" data-type="html">
                        <span class="tab-icon">◆</span> HTML
                    </button>
                    <button class="tab-btn" data-type="css">
                        <span class="tab-icon">◆</span> CSS
                    </button>
                    <button class="tab-btn" data-type="js">
                        <span class="tab-icon">◆</span> JavaScript
                    </button>
                </div>

                <!-- Editors Container -->
                <div class="editors-container">
                    <textarea id="htmlEditor" class="editor active" placeholder="<!-- Write your HTML here -->\n\n<h1>Hello World</h1>" data-type="html"></textarea>
                    <textarea id="cssEditor" class="editor" placeholder="/* Write your CSS here */\n\nbody {\n  font-family: Arial, sans-serif;\n}" data-type="css"></textarea>
                    <textarea id="jsEditor" class="editor" placeholder="// Write your JavaScript here\n\nconsole.log('Hello from JavaScript!');" data-type="js"></textarea>
                </div>

                <!-- Console Section -->
                <div class="console-section">
                    <div class="console-header">
                        <span class="console-title">Debug Console</span>
                        <button id="clearConsoleBtn" class="console-btn">Clear</button>
                    </div>
                    <div id="consoleOutput" class="console-output"></div>
                    <div class="console-input-container">
                        <span class="console-prompt">&gt;</span>
                        <input 
                            type="text" 
                            id="consoleInput" 
                            class="console-input" 
                            placeholder="Type command or code... (/help for commands)"
                            autocomplete="off"
                        >
                    </div>
                </div>
            </div>

            <!-- Divider -->
            <div class="panel-divider" id="panelDivider"></div>

            <!-- Right Preview Panel -->
            <div class="preview-panel" id="previewPanel">
                <div class="preview-header">
                    <span class="preview-title">Preview</span>
                    <button id="fullscreenBtn" class="preview-btn" title="Fullscreen">⛶</button>
                </div>
                <div id="previewContent" class="preview-content">
                    <div class="preview-placeholder">
                        <p>Click Run to see preview</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden iframe for code execution -->
    <iframe id="codeFrame" style="display: none;"></iframe>

    <script src="script.js"></script>
</body>
</html>
