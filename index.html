<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Compiler Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Top Navigation Bar -->
        <nav class="navbar">
            <div class="navbar-brand">
                <h1>⚡ Code Compiler</h1>
            </div>
            <div class="navbar-controls">
                <button id="runBtn" class="btn-run">▶ Run Code</button>
                <button id="formatBtn" class="btn btn-secondary">⚙ Format</button>
            </div>
        </nav>

        <!-- Main Grid Layout -->
        <div class="grid-layout">
            <!-- Left Panel: HTML Editor -->
            <div class="panel">
                <div class="panel-header">
                    <h3>HTML</h3>
                </div>
                <textarea id="htmlEditor" class="editor-input" placeholder="<h1>Hello World</h1>
<p>Welcome to Code Compiler</p>"></textarea>
            </div>

            <!-- Middle Panel: CSS Editor -->
            <div class="panel">
                <div class="panel-header">
                    <h3>CSS</h3>
                </div>
                <textarea id="cssEditor" class="editor-input" placeholder="body {
  font-family: Arial, sans-serif;
  padding: 20px;
}"></textarea>
            </div>

            <!-- Right Panel: JavaScript Editor -->
            <div class="panel">
                <div class="panel-header">
                    <h3>JavaScript</h3>
                </div>
                <textarea id="jsEditor" class="editor-input" placeholder="console.log('Hello from JavaScript!');
// Your code here"></textarea>
            </div>

            <!-- Bottom Right: Preview -->
            <div class="panel full-width">
                <div class="panel-header">
                    <h3>Preview</h3>
                    <div class="header-buttons">
                        <button id="fullscreenBtn" class="btn btn-icon">⛶</button>
                        <button id="clearPreviewBtn" class="btn btn-icon">✕</button>
                    </div>
                </div>
                <div id="previewContent" class="preview-output">
                    <div class="preview-placeholder">
                        <p>Click <strong>Run Code</strong> to execute</p>
                    </div>
                </div>
            </div>

            <!-- Bottom Left: Console -->
            <div class="panel full-width">
                <div class="panel-header">
                    <h3>Console</h3>
                    <button id="clearConsoleBtn" class="btn btn-icon">🗑</button>
                </div>
                <div id="consoleOutput" class="console-output"></div>
                <div class="console-input-row">
                    <span class="console-prompt">&gt;</span>
                    <input type="text" id="consoleInput" class="console-input" placeholder="Type /help for commands">
                </div>
            </div>
        </div>
    </div>

    <iframe id="codeFrame" style="display:none;"></iframe>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="providers.js"></script>
    <script src="script-enhanced.js"></script>
</body>
</html>
